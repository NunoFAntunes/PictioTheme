# Production stack. Deploys copy this file to /opt/pictiotheme/compose.yaml on the VM, next to the
# .env that holds the secrets (created by infra/deploy/bootstrap.sh). See docs/technical/deployment.md.
name: pictiotheme

x-server: &server
  image: ghcr.io/nunofantunes/pictiotheme-server:${IMAGE_TAG:?set by deploy.sh}
  # Any server setting (apps/server/src/config.ts) can be added to .env, e.g. OPENROUTER_API_KEY.
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://pictio:${POSTGRES_PASSWORD:?}@postgres:5432/pictiotheme
    PUBLIC_ORIGIN: https://${SITE_ADDRESS:?}
    TOWER_PUBLIC_ORIGIN: https://${TOWER_SITE_ADDRESS:-tower.localhost}
    # Only Caddy can reach the server, over the private Docker network.
    TRUST_PROXY: uniquelocal
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pictio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: pictiotheme
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pictio -d pictiotheme']
      interval: 5s
      timeout: 3s
      retries: 30

  # One-off: applies migrations and seeds curated decks before the new server starts.
  migrate:
    <<: *server
    profiles: [tools]
    command: ['node', '--enable-source-maps', 'dist/migrate.js']

  server:
    <<: *server
    restart: unless-stopped
    # close-with-grace waits up to 10s for rooms to get the "server restarting" notice.
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  # Read-only database browser. Bound to the VM's loopback only, so it isn't reachable from the internet.
  # Open it through an SSH tunnel: `ssh -L 8081:127.0.0.1:8081 ubuntu@<vm-ip>`, then http://localhost:8081.
  db-viewer:
    image: sosedoff/pgweb:0.17.0
    restart: unless-stopped
    command: ['--readonly', '--bind=0.0.0.0', '--listen=8081', '--skip-open']
    environment:
      PGWEB_DATABASE_URL: postgres://pictio:${POSTGRES_PASSWORD:?}@postgres:5432/pictiotheme?sslmode=disable
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/nunofantunes/pictiotheme-web:${IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
      TOWER_SITE_ADDRESS: ${TOWER_SITE_ADDRESS:-tower.localhost}
      TOWER_TLS_DIRECTIVE: ${TOWER_TLS_DIRECTIVE:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Optional Cloudflare Origin certificate (see TLS_DIRECTIVE in infra/Caddyfile).
      - ./certs:/certs:ro
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
