# Deploys to the VM on every push to the `production` branch (merge main into it to release).
# Runs CI, builds the server and web images (amd64 + arm64) to GHCR, then runs deploy.sh on the VM
# over SSH. Setup, secrets and rollbacks: docs/technical/deployment.md.
name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/nunofantunes/pictiotheme

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Plain JavaScript output, so it's built once here and only copied into the images.
      - run: pnpm --filter @pictiotheme/web build
      - run: pnpm --filter @pictiotheme/server build
      - run: pnpm --filter @pictiotheme/server deploy --prod .deploy/server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: infra
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Copy the stack definition
        run: |
          scp infra/compose.prod.yaml "$TARGET:/opt/pictiotheme/compose.yaml"
          scp infra/deploy/deploy.sh infra/deploy/backup.sh "$TARGET:/opt/pictiotheme/"
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token can pull the images only while this job runs, so log out afterwards.
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin > /dev/null && /opt/pictiotheme/deploy.sh '${{ github.sha }}'; status=\$?; docker logout ghcr.io > /dev/null; exit \$status"
      - name: Smoke test
        if: vars.PUBLIC_URL != ''
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${{ vars.PUBLIC_URL }}/api/ready"
